apply plugin: 'com.android.application'

android {
    compileSdk = 37
    defaultConfig {
        applicationId "edu.cs4730.fragcomnavvmodeldemo"
        minSdk = 32
        targetSdk = 37
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding = true
    }
    namespace 'edu.cs4730.fragcomnavvmodeldemo'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation("com.google.android.material:material:1.14.0")
    implementation 'androidx.navigation:navigation-fragment:2.10.0'
    implementation 'androidx.navigation:navigation-ui:2.10.0'
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.11.0"
    implementation "androidx.lifecycle:lifecycle-livedata:2.11.0"

    // Feature module Support
    implementation "androidx.navigation:navigation-dynamic-features-fragment:2.10.0"

}
